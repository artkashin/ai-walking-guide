name: Offline Russian voice model smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/voice-model.yml'
      - 'app/build.gradle.kts'
      - 'app/src/main/java/com/artkashin/aiwalkingguide/voice/**'
      - 'app/src/voiceModelSmoke/**'
permissions:
  contents: read
jobs:
  native-model:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare verified public Russian model (no credentials)
        run: |
          curl --fail --silent --show-error --max-time 180 --proto '=https' https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip -o model.zip
          echo '961d5ff98a17f4aa6de69864d0aa71fa5bac682301d2b5d17a3f24c5c99a46d4  model.zip' | sha256sum --check
          mkdir .voice-model
          unzip -q model.zip -d .voice-model
          rm model.zip
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: ./gradlew --no-daemon -PvoiceModelSmoke -Pandroid.testInstrumentationRunnerArguments.class=com.artkashin.aiwalkingguide.OfflineRussianModelTest connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-russian-model-test-reports
          path: app/build/reports/androidTests/
